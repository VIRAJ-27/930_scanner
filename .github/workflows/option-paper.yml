name: Option paper scanner

on:
  schedule:
    # 03:55 UTC is 09:25 Asia/Kolkata. Monday-Friday only.
    - cron: "55 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: option-paper-scanner
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      TZ: Asia/Kolkata
      API_KEY: ${{ secrets.API_KEY }}
      CLIENT_CODE: ${{ secrets.CLIENT_CODE }}
      PIN: ${{ secrets.PIN }}
      TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}

    steps:
      - name: Check out scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Close positions at 11:00 and report at 11:15 IST
        run: >-
          python run_scanner.py --option-paper
          --force-exit-at 11:00
          --force-exit-reason TIME_EXIT_11_00
          --stop-at 11:15
          --stop-reason REPORT_COMPLETE_11_15

      - name: Preserve daily reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option-paper-${{ github.run_id }}
          path: |
            LiveReports/
            LiveData/scanner930.db
          if-no-files-found: warn
          retention-days: 30
