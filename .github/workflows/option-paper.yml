name: SOT SETUP live signals

on:
  schedule:
    # GitHub Actions uses UTC: 03:45 UTC is 09:15 Asia/Kolkata, Monday-Friday.
    - cron: "45 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sot-live-signal-scanner
  cancel-in-progress: false

jobs:
  signal-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      TZ: Asia/Kolkata
      API_KEY: ${{ secrets.API_KEY }}
      CLIENT_CODE: ${{ secrets.CLIENT_CODE }}
      PIN: ${{ secrets.PIN }}
      TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}

    steps:
      - name: Check out scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in API_KEY CLIENT_CODE PIN TOTP_SECRET TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing repository secret::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build current F&O stock universe
        run: python export_sot_universe.py

      - name: Monitor SOT SETUP and send signal alerts
        run: >-
          python monitor_sot_live.py
          --universe-csv LiveData/SOT_FO_Universe.csv
          --output SOT_LiveReports
          --cycle-seconds 180
          --history-days 7

      - name: Preserve daily SOT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sot-live-${{ github.run_id }}
          path: |
            SOT_LiveReports/
            LiveData/SOT_FO_Universe.csv
          if-no-files-found: warn
          retention-days: 30

